<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Asset Inspector — home-3d (dev only)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html,body{margin:0;height:100%;background:#eceae6;font:13px/1.45 -apple-system,system-ui,sans-serif;color:#222;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  #panel{position:fixed;top:12px;left:12px;width:290px;background:rgba(255,255,255,.92);border-radius:10px;padding:12px 14px;box-shadow:0 2px 12px rgba(0,0,0,.15)}
  #panel h1{font-size:14px;margin:0 0 8px}
  #panel select,#panel button{font:inherit;padding:3px 6px;margin:2px 2px 2px 0}
  #panel label{display:block;margin:2px 0}
  table{border-collapse:collapse;width:100%;margin-top:8px;font-variant-numeric:tabular-nums}
  td,th{padding:2px 4px;text-align:right;border-bottom:1px solid #ddd}
  th:first-child,td:first-child{text-align:left}
  .ok{color:#1a7f37}.bad{color:#c62828;font-weight:600}
  #badge{position:fixed;bottom:10px;right:12px;font-size:11px;color:#888}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel"></div>
<div id="badge">DEV ONLY — single asset inspector</div>
<script type="module" src="/src/assetViewer/main.ts"></script>
</body>
</html>
