<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scharwoude 15</title>
    <style>
      :root {
        --text-primary: #1f2933;
        --text-secondary: #52606d;
        --panel-bg: rgba(252, 250, 245, 0.82);
        --panel-border: rgba(31, 41, 51, 0.1);
        --accent: #3d6b58;
        --accent-soft: rgba(61, 107, 88, 0.14);
        --dot-inactive: rgba(31, 41, 51, 0.26);
        --dot-active: #2f5948;
        --shadow-soft: 0 10px 30px rgba(24, 34, 42, 0.08);
      }

      body.night-mode {
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --panel-bg: rgba(20, 27, 41, 0.82);
        --panel-border: rgba(241, 245, 249, 0.12);
        --accent: #eab308;
        --accent-soft: rgba(234, 179, 8, 0.16);
        --dot-inactive: rgba(241, 245, 249, 0.28);
        --dot-active: #facc15;
        --shadow-soft: 0 10px 32px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: var(--text-primary);
        overflow-x: hidden;
        background: #d5e8ed;
        -webkit-font-smoothing: antialiased;
      }

      /* Scroll track creates the physical scroll height that scrubs the 3D building construction */
      #scroll-spacer {
        width: 100%;
        height: 560vh;
        pointer-events: none;
      }

      /* Fixed viewport container holding the rotating sky backdrop, WebGL canvas, and minimal UI */
      #viewport-fixed {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      /* Rotating Celestial Day/Night Backdrop Wheel */
      #celestial-backdrop {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
      }

      #sky-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      /* WebGL Canvas */
      #webgl-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        cursor: grab;
      }

      #webgl-canvas:active {
        cursor: grabbing;
      }

      /* Top-Right Controls: Season Switcher + Rotating Day/Night Switch */
      #top-right-controls {
        position: absolute;
        top: 24px;
        right: 28px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .season-pill-group {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        background: var(--panel-bg);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--panel-border);
        padding: 4px;
        border-radius: 999px;
        box-shadow: var(--shadow-soft);
      }

      .season-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: transparent;
        border: none;
        color: var(--text-secondary);
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 550;
        cursor: pointer;
        transition: all 0.2s ease;
        user-select: none;
      }

      .season-btn:hover {
        color: var(--text-primary);
        background: var(--accent-soft);
      }

      .season-btn.active {
        background: var(--accent);
        color: #ffffff;
      }

      body.night-mode .season-btn.active {
        color: #0f172a;
      }

      .season-icon {
        font-size: 13px;
        line-height: 1;
      }

      .pill-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--panel-bg);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--panel-border);
        color: var(--text-primary);
        padding: 9px 14px;
        border-radius: 999px;
        font-size: 12.5px;
        font-weight: 550;
        cursor: pointer;
        box-shadow: var(--shadow-soft);
        transition: all 0.22s ease;
        user-select: none;
      }

      .pill-btn:hover {
        transform: translateY(-1px);
      }

      .pill-btn.active {
        background: var(--accent);
        color: #ffffff;
        border-color: transparent;
      }

      body.night-mode .pill-btn.active {
        color: #0f172a;
      }

      /* Animated Rotating Icon inside Day/Night Toggle */
      .day-night-wheel-icon {
        width: 18px;
        height: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.85s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      body.night-mode .day-night-wheel-icon {
        transform: rotate(180deg);
      }

      /* Right-Side Vertical Manual Floor Selector (Section 5.4) */
      #floor-selector {
        position: absolute;
        right: 32px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        padding: 16px 14px;
        background: var(--panel-bg);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--panel-border);
        border-radius: 999px;
        box-shadow: var(--shadow-soft);
      }

      .selector-track-wrapper {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 24px;
        align-items: center;
      }

      /* Vertical connecting line */
      .selector-line-bg {
        position: absolute;
        top: 11px;
        bottom: 11px;
        left: 50%;
        width: 2px;
        transform: translateX(-50%);
        background: var(--dot-inactive);
        z-index: 0;
        overflow: hidden;
      }

      .selector-line-fill {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 0%;
        background: var(--dot-active);
        transition: height 0.08s linear;
      }

      .floor-dot-btn {
        position: relative;
        z-index: 2;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: none;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
      }

      .floor-dot-core {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--dot-inactive);
        border: 2px solid transparent;
        transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .floor-dot-btn:hover .floor-dot-core {
        transform: scale(1.28);
        background: var(--dot-active);
      }

      .floor-dot-btn.active .floor-dot-core {
        width: 14px;
        height: 14px;
        background: var(--dot-active);
        box-shadow: 0 0 0 4px var(--accent-soft);
      }

      /* Minimal floating label on hover / active */
      .floor-dot-label {
        position: absolute;
        right: 34px;
        white-space: nowrap;
        background: var(--panel-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--panel-border);
        padding: 4px 10px;
        border-radius: 8px;
        font-size: 11.5px;
        font-weight: 550;
        color: var(--text-primary);
        opacity: 0;
        transform: translateX(6px);
        pointer-events: none;
        transition: opacity 0.3s ease, transform 0.3s ease;
        box-shadow: var(--shadow-soft);
      }

      .floor-dot-btn:hover .floor-dot-label,
      .floor-dot-btn.label-visible .floor-dot-label {
        opacity: 1;
        transform: translateX(0);
      }

      /* Bottom Camera Controls Bar */
      #bottom-bar {
        position: absolute;
        bottom: 24px;
        left: 28px;
        right: 28px;
        z-index: 10;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        pointer-events: none;
        gap: 16px;
      }

      .interactive-panel {
        pointer-events: auto;
        background: var(--panel-bg);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--panel-border);
        border-radius: 14px;
        padding: 10px 14px;
        box-shadow: var(--shadow-soft);
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .cam-btn {
        background: transparent;
        border: 1px solid transparent;
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 550;
        padding: 6px 10px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.18s ease;
      }

      .cam-btn:hover {
        color: var(--text-primary);
        background: var(--accent-soft);
      }

      .cam-btn.active {
        color: var(--accent);
        background: var(--accent-soft);
        font-weight: 600;
      }

      .divider-v {
        width: 1px;
        height: 18px;
        background: var(--panel-border);
      }

      /* Scroll Prompt Pill at Center Bottom when at Plot stage */
      #scroll-hint {
        position: absolute;
        bottom: 84px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9;
        background: var(--panel-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--panel-border);
        padding: 8px 16px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 550;
        color: var(--text-secondary);
        box-shadow: var(--shadow-soft);
        pointer-events: none;
        transition: opacity 0.35s ease, transform 0.35s ease;
      }

      #scroll-hint.hidden {
        opacity: 0;
        transform: translate(-50%, 8px);
      }

      @media (max-width: 768px) {
        #top-right-controls {
          top: auto;
          bottom: 82px;
          left: 14px;
          right: auto;
          justify-content: flex-start;
        }
        .season-btn {
          padding: 5px 8px;
        }
        .season-text {
          display: none;
        }
        #floor-selector {
          right: 14px;
        }
      }

  <body>
    <!-- Invisible scroll track driving the deterministic building assembly -->
    <div id="scroll-spacer"></div>

    <!-- Fixed 3D Viewport & Architectural UI -->
    <div id="viewport-fixed">
      <!-- Rotating Celestial Day/Night Backdrop -->
      <div id="celestial-backdrop">
        <canvas id="sky-canvas"></canvas>
      </div>

      <!-- Three.js WebGL Canvas -->
      <canvas id="webgl-canvas"></canvas>

      <!-- Top-Left Project Header & Synchronised Floor Readout -->


      <!-- Top-Right Toggles: Season Switcher + Day/Night -->
      <div id="top-right-controls">
        <div id="season-switcher" class="season-pill-group" role="group" aria-label="Seizoen">
          <button class="season-btn" data-season="spring" title="Lente · Bloesem (Sneltoets: S)">
            <span class="season-icon">🌸</span>
            <span class="season-text">Lente</span>
          </button>
          <button class="season-btn active" data-season="summer" title="Zomer · Zonnig (Sneltoets: S)">
            <span class="season-icon">🌿</span>
            <span class="season-text">Zomer</span>
          </button>
          <button class="season-btn" data-season="autumn" title="Herfst · Regen &amp; vallend blad (Sneltoets: S)">
            <span class="season-icon">🍂</span>
            <span class="season-text">Herfst</span>
          </button>
          <button class="season-btn" data-season="winter" title="Winter · Sneeuw (Sneltoets: S)">
            <span class="season-icon">❄️</span>
            <span class="season-text">Winter</span>
          </button>
        </div>
        <button id="btn-day-night" class="pill-btn" title="Wissel tussen Dag en Avond (Sneltoets: N)">
          <span class="day-night-wheel-icon" id="day-night-icon">☀️</span>
          <span id="day-night-label">Dag</span>
        </button>
      </div>

      <!-- Right-Side Vertical Manual Floor Selector (Section 5.4) -->
      <nav id="floor-selector" aria-label="Woonlaag selector">
        <div class="selector-track-wrapper">
          <div class="selector-line-bg">
            <div class="selector-line-fill" id="selector-line-fill"></div>
          </div>

          <button class="floor-dot-btn active" data-stop-index="0" aria-label="Kavel">
            <span class="floor-dot-core"></span>
            <span class="floor-dot-label">Kavel</span>
          </button>
          <button class="floor-dot-btn" data-stop-index="1" aria-label="Begane Grond">
            <span class="floor-dot-core"></span>
            <span class="floor-dot-label">Begane Grond</span>
          </button>
          <button class="floor-dot-btn" data-stop-index="2" aria-label="1e Verdieping">
            <span class="floor-dot-core"></span>
            <span class="floor-dot-label">1e Verdieping</span>
          </button>
          <button class="floor-dot-btn" data-stop-index="3" aria-label="2e Verdieping">
            <span class="floor-dot-core"></span>
            <span class="floor-dot-label">2e Verdieping</span>
          </button>
          <button class="floor-dot-btn" data-stop-index="4" aria-label="Kap">
            <span class="floor-dot-core"></span>
            <span class="floor-dot-label">Kap</span>
          </button>
        </div>
      </nav>

      <!-- Subtle Scroll Hint -->
      <div id="scroll-hint">Scroll om de woning op te bouwen ↓</div>

      <!-- Bottom Camera Bar -->
      <div id="bottom-bar">
        <div class="interactive-panel" id="camera-toolbar">
          <button class="cam-btn active" data-cam-preset="default_iso">Voorzijde</button>
          <button class="cam-btn" data-cam-preset="garden_iso">Tuinzijde</button>
          <button class="cam-btn" data-cam-preset="top_plan">Bovenaanzicht</button>
          <div class="divider-v"></div>
          <button class="cam-btn" id="btn-zoom-in" title="Zoom in">+</button>
          <button class="cam-btn" id="btn-zoom-out" title="Zoom uit">−</button>
          <button class="cam-btn" id="btn-cam-reset" title="Herstel standaard camerapositie">Reset</button>
        </div>
      </div>
    </div>

  </body>
</html>
